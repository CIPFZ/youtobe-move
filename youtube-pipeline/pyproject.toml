[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-pipeline"
version = "1.0.0"
description = "Local YouTube download, merge, and Bilibili publish pipeline"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools]
py-modules = ["main", "youtube_api_cli", "media_urls_cli"]

[tool.setuptools.package-data]
app = ["web_static/*.html"]

[project.scripts]
youtube-pipeline = "main:main"
youtube-api = "youtube_api_cli:main"
youtube-media-urls = "media_urls_cli:main"

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
